[package]
name = "desktop-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
desktop-menu-diagnostics = []
menu-diagnostics = []

[[example]]
name = "desktop_menu_service_probe"
required-features = ["desktop-menu-diagnostics"]

[[example]]
name = "folder_menu_bridge_probe"
required-features = ["desktop-menu-diagnostics"]

[dependencies]
desktop-core.workspace = true
windows.workspace = true
windows-core = "0.62.2"
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_UI_Accessibility"] }

[dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Search", "Win32_System_Search_Common", "Win32_Storage_EnhancedStorage"] }
windows-window.workspace = true
desktop-hook.workspace = true
desktop-window.workspace = true

[lints]
workspace = true

[[example]]
name = "desktop_filter_probe_hook"
required-features = ["desktop-menu-diagnostics"]
path = "examples/support/desktop_filter_probe_hook.rs"
crate-type = ["cdylib"]

[[example]]
name = "desktop_filter_probe"
required-features = ["desktop-menu-diagnostics"]
