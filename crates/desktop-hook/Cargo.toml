[package]
name = "desktop-hook"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "luciddesk_desktop"
crate-type = ["rlib", "cdylib"]

[features]
default = []
menu-diagnostics = []

[dependencies]
windows = { workspace = true, features = ["Win32_System_Ole", "Win32_System_Com", "Win32_System_SystemServices"] }
windows-core = "0.62.2"
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_UI_Accessibility"] }

[lints]
workspace = true
