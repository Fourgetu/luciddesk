[package]
name = "desktop-hook"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
legacy-geometry = ["dep:cc"]
menu-diagnostics = []
drag-trace = ["legacy-geometry"]
input-trace = ["legacy-geometry"]

[dependencies]
windows = { workspace = true, features = ["Win32_System_Ole", "Win32_System_Com", "Win32_System_SystemServices"] }
windows-core = "0.62.2"
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[build-dependencies]
cc = { version = "1.2", optional = true }

[[example]]
name = "geometry_probe"
required-features = ["legacy-geometry"]

[lints]
workspace = true
