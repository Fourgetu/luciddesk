<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">LucidDesk — Less clutter. More focus.</title>
  <desc id="desc">Organize icons, keep folders close, and find files from your desktop. Groups keep references. Your files stay in place. Feature illustration · Not a screenshot</desc>
