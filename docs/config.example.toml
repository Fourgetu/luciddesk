# LucidDesk global settings. Reload from Settings after editing.
config_version = 1
# system, zh-CN, zh-TW, en-US, ja-JP, ko-KR, de-DE, ru-RU; restart to apply.
language = "system"

[appearance]
theme = "system"
material = "mica"

[appearance.acrylic]
strength = 50

[appearance.mica]
strength = 50

[appearance.translucent]
opacity = 0.86

[appearance.solid]
color = "#24364B"
opacity = 0.85

[panel_defaults]
corner_radius = 6.0
# Grid scale percentage; 100% = 88 x 96 DIP.
grid_scale = 100.0
border = true
snap = true
text = "auto"
text_protection = false

[show_panels]
enabled = false
shortcut = "Ctrl+Shift+D"

[search]
enabled = false
shortcut = "Ctrl+Shift+Space"
everything_path = ""

[preview]
enabled = false
provider = "peek"
shortcut = "Space"
peek_path = ""
quicklook_path = ""
