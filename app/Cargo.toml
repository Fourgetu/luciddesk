[package]
name = "lucidpane"
default-run = "lucidpane"
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lucidpane"
path = "src/main.rs"

[dependencies]
desktop-core.workspace = true
desktop-shell.workspace = true
desktop-storage.workspace = true
tempfile = "3"
desktop-window.workspace = true
desktop-hook.workspace = true
windows = { workspace = true, features = ["UI_ViewManagement", "Graphics_Effects", "Win32_System_WinRT_Graphics_Direct2D"] }
windows-core = "0.62.2"
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Time", "Win32_System_DataExchange", "Win32_System_LibraryLoader"] }
windows-window.workspace = true
windows-numerics.workspace = true
windows-canvas = { version = "=0.100.0", default-features = false }
canvas-core = { package = "windows-core", version = "=0.100.0", default-features = false }
windows-animation = "=0.100.0"
windows-version = "=0.100.0"
desktop-graphics = { path = "../crates/desktop-graphics" }

[dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus"] }

[lints]
workspace = true

[build-dependencies]
embed-resource = "3.0.11"
