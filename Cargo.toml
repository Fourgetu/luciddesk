[workspace]
members = [
    "app",
    "crates/desktop-core",
    "crates/desktop-graphics",
    "crates/desktop-shell",
    "crates/desktop-menu",
    "crates/desktop-storage",
    "crates/desktop-window",
    "crates/desktop-explorer",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
desktop-menu = { path = "crates/desktop-menu" }
desktop-core = { path = "crates/desktop-core" }
desktop-shell = { path = "crates/desktop-shell" }
desktop-storage = { path = "crates/desktop-storage" }
desktop-window = { path = "crates/desktop-window" }
desktop-explorer = { path = "crates/desktop-explorer" }
# Panel IDs use u64; preserve checked INTEGER conversions in rusqlite 0.40.
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "fallible_uint"] }
windows-window = "0.100.0"
windows-numerics = "0.3.1"
windows-sys = "0.61.2"
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
raw_borrows_via_references = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
