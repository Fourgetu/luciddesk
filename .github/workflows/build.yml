name: Build CI
on:
  push:
    tags: ['**']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup override set 1.95.0
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package version.' }
          $version = ($metadata.packages | Where-Object name -eq 'luciddesk').version
          if (@($version, "v$version") -cnotcontains $env:GITHUB_REF_NAME) { throw 'Tag must match the app version: <version> or v<version>.' }
      - name: Test bilingual release notes / 测试双语发布说明
        run: python -m unittest discover -s tools -p "test_release_notes.py"
      - name: Check language resources
        run: python tools/check-locales.py
      - name: Test Fluent resources
        run: cargo test -p luciddesk --bin luciddesk i18n::tests --locked
      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked
      - name: Test workspace data and layout rules
        run: cargo test -p desktop-core -p desktop-storage --lib --locked
      - name: Package standard and portable ZIPs
        shell: pwsh
        run: |
          ./tools/package.ps1
          ./tools/package.ps1 -Portable
      - uses: actions/upload-artifact@v4
        with:
          name: LucidDesk-windows-x64
          path: |
            target/packages/*.zip
            target/packages/*.sha256
            target/portable/**/*.zip
            target/portable/**/*.sha256
          if-no-files-found: error
  release:
    needs: build
    if: github.repository == 'Yuch3nE/luciddesk' && startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LucidDesk-windows-x64
          path: artifacts
      - name: Verify and publish bilingual release / 校验并发布双语 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 tools/release-notes.py --tag "$RELEASE_TAG" --repository "$GH_REPO" --changelog CHANGELOG.md --changelog-en CHANGELOG.en.md --output release-notes.md
          mapfile -d '' archives < <(find artifacts -type f -name '*.zip' -print0)
          mapfile -d '' checksums < <(find artifacts -type f -name '*.zip.sha256' -print0)
          [[ ${#archives[@]} -eq 2 && ${#checksums[@]} -eq 2 ]]
          for checksum in "${checksums[@]}"; do
            (cd "$(dirname "$checksum")" && sha256sum -c "$(basename "$checksum")")
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "${archives[@]}" "${checksums[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${archives[@]}" "${checksums[@]}" --verify-tag --title "LucidDesk $RELEASE_TAG" --notes-file release-notes.md
          fi
